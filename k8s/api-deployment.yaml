apiVersion: apps/v1
kind: Deployment
metadata:
  name: nest-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nest-api
  template:
    metadata:
      labels:
        app: nest-api
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-bookworm
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              attempt=0
              until pg_isready -h postgres-service -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
                attempt=$((attempt + 1))
                if [ "$attempt" -ge 60 ]; then
                  echo "PostgreSQL was not ready after 60 attempts" >&2
                  exit 1
                fi
                echo "Waiting for PostgreSQL ($attempt/60)..."
                sleep 2
              done
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: POSTGRES_DB
        - name: wait-and-migrate
          image: nest-migrate:latest
          imagePullPolicy: Never
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DATABASE_URL
      containers:
        - name: api
          image: nest-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /api/todos
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nest-api-service
spec:
  selector:
    app: nest-api
  ports:
    - port: 3000
      targetPort: 3000
  type: NodePort
